name: Build CueFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_foreground_service namespace
        run: |
          FILE=$(find ~/.pub-cache/hosted/pub.dev -name 'build.gradle' -path '*flutter_foreground_service*android/build.gradle' | head -n 1)
          if [ -n "$FILE" ]; then
            if ! grep -q "namespace" "$FILE"; then
              echo "" >> "$FILE"
              echo "android { namespace 'dk.cachet.flutter_foreground_service' }" >> "$FILE"
              echo "Patched $FILE"
            else
              echo "Already has namespace"
            fi
          fi

      - name: Analyze project
        run: flutter analyze || true

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueflow-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}